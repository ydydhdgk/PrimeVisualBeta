buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0'
group = 'com.example.visuals'
archivesBaseName = 'visuals-1.16.5'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
        resources {
            srcDirs = []
        }
    }
}

processResources {
    from('mods.toml') { into 'META-INF' }
    from('pack.mcmeta')
    from('logo.png')
    from('logo.png') { into 'assets/visuals/textures' }
    from('en_us.json') { into 'assets/visuals/lang' }
    from('ru_ru.json') { into 'assets/visuals/lang' }
    from('options_background.png') { into 'assets/minecraft/textures/gui' }
    from('minecraft.png') { into 'assets/minecraft/textures/gui/title' }
    from('cape.png') { into 'assets/visuals/textures' }
    from('hat.png') { into 'assets/visuals/textures' }
    from('halo.png') { into 'assets/visuals/textures' }
    ['dollar', 'amogus', 'iphone', 'coin', 'diamond'].each { n ->
        from("fx_${n}.png") {
            into 'assets/visuals/textures/fx'
            rename { String f -> n + '.png' }
        }
    }
    ['pay', 'cash', 'pop', 'boing', 'bell'].each { n ->
        from("hit_${n}.ogg") { into 'assets/visuals/sounds' }
    }
    from('sounds.json') { into 'assets/visuals' }
    (0..5).each { i ->
        from("panorama_${i}.png") { into 'assets/minecraft/textures/gui/title/background' }
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client {
            workingDirectory project.file('run')
            mods { visuals { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

jar.finalizedBy('reobfJar')
